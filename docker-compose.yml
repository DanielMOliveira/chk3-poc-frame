# POC CHK3 frame v7. Sem Front Door, APIM e Identity Server.
# Nome fixo do projeto compose: containers e volume (chk3-poc-frame_pgdata) não dependem do nome do diretório.
# Para rodar duas cópias na mesma máquina: COMPOSE_PROJECT_NAME=outro-nome (tem precedência sobre name:).
name: chk3-poc-frame
# Redes espelham a segmentação do desenho: "fora" (fora da CDE), "cde", "vpn" (até o Gateway) e "dados".
x-app: &app
  build: { context: ., dockerfile: Dockerfile }
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  logging: &logging   # json-file com rotação. O Alloy lê os logs dos containers e guarda no Loki (sobrevivem ao deploy).
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  environment: &env
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:?defina no .env}
    SNAPSHOT_SIGNING_KEY: ${SNAPSHOT_SIGNING_KEY:?defina no .env}
    # Origens públicas (CSP, frame-ancestors, frameUrl). Se vazias no .env, derivam das portas do host.
    CANAL_PUBLIC_ORIGIN: ${CANAL_PUBLIC_ORIGIN:-http://localhost:${CANAL_HOST_PORT:-8080}}
    OPCOES_PUBLIC_ORIGIN: ${OPCOES_PUBLIC_ORIGIN:-http://localhost:${OPCOES_HOST_PORT:-8081}}
    CARTAO_PUBLIC_ORIGIN: ${CARTAO_PUBLIC_ORIGIN:-http://localhost:${CARTAO_HOST_PORT:-8082}}
    INTEGRATION_INTERNAL_URL: http://integration:8090
    Logging__LogLevel__Default: Information
    Logging__LogLevel__Microsoft.AspNetCore: Warning

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [dados]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  integration:   # Integration API: passos 2-4 (público) e 6, 7, 8, 10, 13 (interno)
    <<: *app
    build: { context: ., args: { PROJECT: Integration } }
    environment:
      <<: *env
      POSTGRES_CONNECTION: Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
      CHANNEL_JWT_SECRET: ${CHANNEL_JWT_SECRET:?defina no .env}
      CHANNEL_JWT_ISSUER: ${CHANNEL_JWT_ISSUER:?defina no .env}
    ports: ["${HOST_BIND:-127.0.0.1}:${INTEGRATION_HOST_PORT:-8083}:8080"]   # só a porta pública. A 8090 (interna) não é publicada.
    networks: [fora, cde, dados]
    depends_on: { postgres: { condition: service_healthy } }

  opcoes:        # Tela de opções (fora da CDE): passos 5-7 e 14
    <<: *app
    build: { context: ., args: { PROJECT: Opcoes } }
    ports: ["${HOST_BIND:-127.0.0.1}:${OPCOES_HOST_PORT:-8081}:8080"]
    networks: [fora]
    depends_on: [integration]

  cartao:        # Web App Cartão (CDE, endpoint pay): passos 8, 9 e 14
    <<: *app
    build: { context: ., args: { PROJECT: Cartao } }
    environment:
      <<: *env
      AUTORIZACAO_URL: http://autorizacao:8080
      GATEWAY_REAL_TIMEOUT_MS: ${GATEWAY_REAL_TIMEOUT_MS:-15000}  # espera a API Autorização por este + 5 s
    ports: ["${HOST_BIND:-127.0.0.1}:${CARTAO_HOST_PORT:-8082}:8080"]
    networks: [cde]
    depends_on: [integration, autorizacao]

  autorizacao:   # API Autorização (CDE, sem banco): passos 9-13. Sem porta publicada.
    <<: *app
    build: { context: ., args: { PROJECT: Autorizacao } }
    environment:
      <<: *env
      # Endpoint completo do Gateway. Padrão: o mock. Na VPS: o Gateway real (no .env). Os PANs de simulação do
      # mock (4111..., 4000...0002, 4000...0119, 5555..., 5105...) vão sempre para GATEWAY_MOCK_URL (smoke/CI).
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway-mock:8080/poc/v1/authorize}
      GATEWAY_MOCK_URL: http://gateway-mock:8080/poc/v1/authorize
      GATEWAY_CONTENT_TYPE: ${GATEWAY_CONTENT_TYPE:-application/xml}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?defina no .env}
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-3000}
      GATEWAY_REAL_TIMEOUT_MS: ${GATEWAY_REAL_TIMEOUT_MS:-15000}
      POC_TEST_PANS_ONLY: "true"
      POC_GATEWAY_TEST_PANS: ${POC_GATEWAY_TEST_PANS:-5453010000066167}
      # <transaction-request> do passo 11. merchantKey só no .env.
      GATEWAY_MERCHANT_ID: ${GATEWAY_MERCHANT_ID:?defina no .env}
      GATEWAY_MERCHANT_KEY: ${GATEWAY_MERCHANT_KEY:?defina no .env}
      GATEWAY_ACQUIRER: ${GATEWAY_ACQUIRER:-1}
      GATEWAY_SOFT_DESCRIPTOR: ${GATEWAY_SOFT_DESCRIPTOR:-CHK3POC}
      GATEWAY_METHOD_PARCELADO: ${GATEWAY_METHOD_PARCELADO:-2}
      GATEWAY_SAVE_CREDIT_CARD: ${GATEWAY_SAVE_CREDIT_CARD:-false}
    # saida: egress para o Gateway real (no v7 seria a VPN). vpn: o mock.
    networks: [cde, vpn, saida]

  gateway-mock:  # Gateway MCN simulado (passos 11-12). Só alcançável pela API Autorização.
    <<: *app
    build: { context: ., args: { PROJECT: GatewayMock } }
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?defina no .env}
      GATEWAY_MOCK_TIMEOUT_DELAY_MS: ${GATEWAY_MOCK_TIMEOUT_DELAY_MS:-10000}
      GATEWAY_MERCHANT_ID: ${GATEWAY_MERCHANT_ID:?defina no .env}
      GATEWAY_MERCHANT_KEY: ${GATEWAY_MERCHANT_KEY:?defina no .env}
      GATEWAY_METHOD_PARCELADO: ${GATEWAY_METHOD_PARCELADO:-2}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    networks: [vpn]

  canal:         # Canal fake (passos 1 e 4 do lado do canal)
    <<: *app
    build: { context: ., args: { PROJECT: CanalFake } }
    environment:
      <<: *env
      CHANNEL_JWT_SECRET: ${CHANNEL_JWT_SECRET:?defina no .env}
      CHANNEL_JWT_ISSUER: ${CHANNEL_JWT_ISSUER:?defina no .env}
      INTEGRATION_PUBLIC_URL: http://integration:8080
    ports: ["${HOST_BIND:-127.0.0.1}:${CANAL_HOST_PORT:-8080}:8080"]
    networks: [fora]
    depends_on: [integration]

  worker:        # Worker (passos 15-16 mínimos): webhook do outbox ao canal e expurgo do token do frame. Sem porta.
    <<: *app
    build: { context: ., args: { PROJECT: Worker } }
    environment:
      POSTGRES_CONNECTION: Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
      WEBHOOK_DEFAULT_URL: ${WEBHOOK_DEFAULT_URL:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?defina no .env}
      PURGE_INTERVAL_SECONDS: ${PURGE_INTERVAL_SECONDS:-60}
      PURGE_USED_GRACE_SECONDS: ${PURGE_USED_GRACE_SECONDS:-600}
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    networks: [dados, saida]   # saida: única rede com internet além da "fora", só para o webhook
    depends_on: [integration]

  # ---------- Observabilidade: Grafana + Loki + Alloy (logs dos containers da aplicação) ----------
  docker-proxy:  # Só leitura (GET) da API do Docker: containers (lista e logs) e redes. Sem POST/exec. Só o Alloy alcança.
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment: { CONTAINERS: 1, NETWORKS: 1, POST: 0, EVENTS: 0, INFO: 0, IMAGES: 0, VOLUMES: 0, EXEC: 0 }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [obs]
    mem_limit: 64m
    logging: *logging

  loki:          # Guarda os logs (7 dias, volume lokidata): não se perdem quando o deploy recria os containers.
    image: grafana/loki:3.6.5
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./observabilidade/loki.yaml:/etc/loki/loki.yaml:ro", "lokidata:/loki"]
    networks: [obs]
    mem_limit: 384m
    environment: { GOMEMLIMIT: 320MiB }
    logging: *logging

  alloy:         # Coletor: lê os logs dos containers deste projeto (via docker-proxy) e envia ao Loki.
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "--disable-reporting", "/etc/alloy/config.alloy"]
    environment:
      CHK3_PROJECT: ${COMPOSE_PROJECT_NAME:-chk3-poc-frame}
      GOMEMLIMIT: 200MiB
    volumes: ["./observabilidade/config.alloy:/etc/alloy/config.alloy:ro", "alloydata:/var/lib/alloy/data"]
    networks: [obs]
    mem_limit: 256m
    depends_on: [loki, docker-proxy]
    logging: *logging

  grafana:       # Painel "CHK3 · Transação ponta a ponta" (provisionado do git). Só 127.0.0.1; acesso por túnel SSH.
    image: grafana/grafana-oss:12.4.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/chk3-transacao.json
    volumes: ["./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro", "grafanadata:/var/lib/grafana"]
    ports: ["${HOST_BIND:-127.0.0.1}:${GRAFANA_HOST_PORT:-18184}:3000"]
    networks: [obs, obs-pub]
    mem_limit: 256m
    depends_on: [loki]
    logging: *logging

  tests:         # Testes xUnit dentro da rede do compose: só precisa de Docker. Uso: ./scripts/test.sh
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: [test]
    working_dir: /work
    volumes: [".:/src:ro", "nuget:/root/.nuget/packages"]
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CHANNEL_JWT_SECRET: ${CHANNEL_JWT_SECRET:?defina no .env}
      CHANNEL_JWT_ISSUER: ${CHANNEL_JWT_ISSUER:?defina no .env}
      # Origens públicas (para conferir CSP) e URLs de acesso dentro da rede docker.
      CANAL_PUBLIC_ORIGIN: ${CANAL_PUBLIC_ORIGIN:-http://localhost:${CANAL_HOST_PORT:-8080}}
      OPCOES_PUBLIC_ORIGIN: ${OPCOES_PUBLIC_ORIGIN:-http://localhost:${OPCOES_HOST_PORT:-8081}}
      CARTAO_PUBLIC_ORIGIN: ${CARTAO_PUBLIC_ORIGIN:-http://localhost:${CARTAO_HOST_PORT:-8082}}
      INTEGRATION_URL: http://integration:8080
      TEST_OPCOES_URL: http://opcoes:8080
      TEST_CARTAO_URL: http://cartao:8080
    # Copia o código (sem bin/obj do host) para não escrever no clone nem depender de permissões.
    command: ["sh", "-c", "cp -r /src/. /work/ && find /work -type d \\( -name bin -o -name obj \\) -prune -exec rm -rf {} + && dotnet test tests/Chk3.Tests"]
    networks: [fora, cde]
    depends_on: [integration, opcoes, cartao]

networks:
  fora: {}
  cde: {}
  vpn: { internal: true }
  dados: { internal: true }
  saida: {}                  # Worker -> internet (webhook)
  obs: { internal: true }    # Loki, Alloy, docker-proxy, Grafana
  obs-pub: {}                # só para publicar a porta do Grafana em 127.0.0.1

volumes:
  pgdata: {}
  nuget: {}
  lokidata: {}
  alloydata: {}
  grafanadata: {}
